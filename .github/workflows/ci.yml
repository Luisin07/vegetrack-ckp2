name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 1. Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: 2. Lint (ruff, formatação e fronteiras do domínio)
        run: |
          ruff check .
          ruff format --check .
          lint-imports

      - name: 3. Testes com cobertura
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90
